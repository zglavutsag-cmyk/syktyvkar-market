<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои объявления</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- ШАПКА -->
        <header class="header">
            <div class="header-top">
                <a href="index.html" style="text-decoration: none; color: var(--accent-blue); font-size: 16px;">
                    ← Назад
                </a>
                <div class="user-info">
                    <span id="user-name">Гость</span>
                </div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px;">
                <h1 style="font-size: 24px; font-weight: 700;">Мои объявления</h1>
                <a href="create-business.html" class="btn" style="width: auto; padding: 10px 16px; font-size: 14px; background: linear-gradient(135deg, #ffd700, #ffaa00); color: #000; font-weight: 700;">
                     Мой магазин
                </a>
            </div>
        </header>

        <!-- БЛОК МОЕГО МАГАЗИНА (показывается если есть профиль) -->
        <div id="my-business-section" style="display: none; margin-bottom: 16px;">
            <!-- Загрузится через JS -->
        </div>

        <!-- МОИ ОБЪЯВЛЕНИЯ -->
        <div id="my-listings" class="listings-section">
            <!-- Загрузится через JS -->
        </div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <div class="nav-icon">🏠</div>
            <div class="nav-label">Главная</div>
        </a>
        <a href="favorites.html" class="nav-item">
            <div class="nav-icon">❤️</div>
            <div class="nav-label">Избранное</div>
        </a>
        <a href="chats.html" class="nav-item">
            <div class="nav-icon" style="position: relative;">
                💬
                <span id="unread-badge" style="display: none; position: absolute; top: -6px; right: -10px; background: #f44336; color: white; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; align-items: center; justify-content: center; padding: 0 4px;">0</span>
            </div>
            <div class="nav-label">Чаты</div>
        </a>
        <a href="create.html" class="nav-item">
            <div class="nav-icon">➕</div>
            <div class="nav-label">Создать</div>
        </a>
        <a href="my-listings.html" class="nav-item active">
            <div class="nav-icon">📋</div>
            <div class="nav-label">Мои</div>
        </a>
    </nav>

    <script src="js/app.js"></script>
    <script>
        // Обновляем имя пользователя в шапке
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user && user.first_name) {
                document.getElementById('user-name').textContent = user.first_name;
            }
            
            // Загружаем информацию о бизнес-профиле
            loadMyBusinessProfile();
        });

        // Загрузка моего бизнес-профиля
        async function loadMyBusinessProfile() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) return;
            
            try {
                const response = await fetch(`/api/business/profile/${user.telegram_id}`);
                
                if (response.ok) {
                    const profile = await response.json();
                    const section = document.getElementById('my-business-section');
                    const isPremium = profile.is_premium === 1 && new Date(profile.premium_until) > new Date();
                    
                    section.style.display = 'block';
                    section.innerHTML = `
                        <div class="business-header" style="margin-bottom: 0;">
                            ${isPremium ? '<div class="premium-badge">⭐ PREMIUM</div>' : ''}
                            <div style="display: flex; align-items: center; gap: 16px;">
                                <div class="business-logo" style="margin: 0;">
                                    ${profile.logo_filename ? `<img src="/uploads/${profile.logo_filename}" alt="Logo">` : '🏢'}
                                </div>
                                <div style="text-align: left; flex: 1;">
                                    <div class="business-name" style="font-size: 18px;">${profile.business_name}</div>
                                    <div class="business-category">${profile.category || 'Бизнес'} • ⭐ ${profile.rating || 5}</div>
                                </div>
                            </div>
                            <a href="business.html?userId=${user.telegram_id}" class="btn btn-secondary" style="margin-top: 12px; font-size: 14px;">
                                Открыть витрину →
                            </a>
                        </div>
                    `;
                }
            } catch (error) {
                // Профиль не найден — ничего не показываем
                console.log('Бизнес-профиль не создан');
            }
        }
    </script>
</body>
</html>
