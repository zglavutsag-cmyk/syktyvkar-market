<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Создать объявление</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #f5f5f7; color: #1c1c1e; padding-bottom: 80px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; }
        .back-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; text-decoration: none; }
        .header h1 { font-size: 18px; font-weight: 700; }
        .form-container { max-width: 600px; margin: 20px auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #555; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 16px; outline: none; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #667eea; }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .submit-btn { width: 100%; padding: 15px; background: #667eea; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
        .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .file-input-wrapper input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .file-input-label { display: block; padding: 12px; border: 2px dashed #ccc; border-radius: 10px; text-align: center; color: #666; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <a class="back-btn" href="/index.html">←</a>
    <h1>Новое объявление</h1>
</div>

<div class="form-container">
    <form id="createForm">
        <div class="form-group">
            <label>Название *</label>
            <input type="text" id="title" required placeholder="Например: iPhone 13">
        </div>
        <div class="form-group">
            <label>Категория *</label>
            <select id="category" required></select>
        </div>
        <div class="form-group">
            <label>Цена (₽) *</label>
            <input type="number" id="price" required placeholder="0 для 'Отдам даром'">
        </div>
        <div class="form-group">
            <label>Описание</label>
            <textarea id="description" placeholder="Опишите состояние, характеристики..."></textarea>
        </div>
        <div class="form-group">
            <label>Город</label>
            <input type="text" id="city" value="Сыктывкар">
        </div>
        <div class="form-group">
            <label>Фотографии</label>
            <div class="file-input-wrapper">
                <div class="file-input-label">📷 Нажмите, чтобы выбрать фото</div>
                <input type="file" id="images" accept="image/*" multiple>
            </div>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">Опубликовать</button>
    </form>
</div>

<script>
// Берем реальные данные пользователя из localStorage
const currentUserId = localStorage.getItem('telegramId') || 'user_' + Date.now();
const userName = localStorage.getItem('userName') || 'Гость';

// Загрузка категорий
async function loadCategories() {
    try {
        const res = await fetch('/api/categories');
        const cats = await res.json();
        const select = document.getElementById('category');
        cats.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = `${c.icon} ${c.name}`;
            select.appendChild(opt);
        });
    } catch (e) { console.error(e); }
}

document.getElementById('createForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Публикация...';

    const formData = new FormData();
    formData.append('telegramId', currentUserId);
    formData.append('username', userName);
    formData.append('firstName', userName);
    formData.append('categoryId', document.getElementById('category').value);
    formData.append('title', document.getElementById('title').value);
    formData.append('price', document.getElementById('price').value);
    formData.append('description', document.getElementById('description').value);
    formData.append('city', document.getElementById('city').value);

    const files = document.getElementById('images').files;
    for (let i = 0; i < files.length; i++) {
        formData.append('images', files[i]);
    }

    try {
        const res = await fetch('/api/listings', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
            alert('✅ Объявление успешно опубликовано!');
            window.location.href = '/index.html';
        } else {
            alert('❌ Ошибка: ' + (data.error || 'Неизвестная ошибка'));
            btn.disabled = false;
            btn.textContent = 'Опубликовать';
        }
    } catch (e) {
        alert('❌ Ошибка сети');
        btn.disabled = false;
        btn.textContent = 'Опубликовать';
    }
});

loadCategories();
</script>
</body>
</html>
