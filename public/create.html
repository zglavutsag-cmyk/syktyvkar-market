<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Создать объявление</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #f5f5f7; color: #1c1c1e; padding-bottom: 80px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; }
        .back-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; text-decoration: none; }
        .header h1 { font-size: 18px; font-weight: 700; }
        .form-container { max-width: 600px; margin: 20px auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #555; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 16px; outline: none; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #667eea; }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .submit-btn { width: 100%; padding: 15px; background: #667eea; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
        
        /* Превью фотографий */
        .photo-preview-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .photo-preview {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
            background: #f0f0f0;
            border-radius: 8px;
            overflow: hidden;
            border: 2px dashed #ccc;
        }
        .photo-preview img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-preview .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            background: rgba(255, 59, 48, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-preview.add-photo {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px dashed #667eea;
        }
        .photo-preview.add-photo span {
            font-size: 40px;
            color: #667eea;
        }
        .photo-count {
            text-align: center;
            font-size: 13px;
            color: #999;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="header">
    <a class="back-btn" href="/index.html">←</a>
    <h1>Новое объявление</h1>
</div>

<div class="form-container">
    <form id="createForm">
        <div class="form-group">
            <label>Название *</label>
            <input type="text" id="title" required placeholder="Например: iPhone 13">
        </div>
        <div class="form-group">
            <label>Категория *</label>
            <select id="category" required></select>
        </div>
        <div class="form-group">
            <label>Цена (₽) *</label>
            <input type="number" id="price" required placeholder="0 для 'Отдам даром'">
        </div>
        <div class="form-group">
            <label>Описание</label>
            <textarea id="description" placeholder="Опишите состояние, характеристики..."></textarea>
        </div>
        <div class="form-group">
            <label>Город</label>
            <input type="text" id="city" value="Сыктывкар">
        </div>
        <div class="form-group">
            <label>Фотографии (до 5 штук)</label>
            <div class="photo-preview-container" id="photoPreview">
                <div class="photo-preview add-photo" id="addPhotoBtn">
                    <span>+</span>
                </div>
            </div>
            <div class="photo-count" id="photoCount">0 / 5 фото</div>
            <input type="file" id="images" accept="image/*" multiple style="display: none;">
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">Опубликовать</button>
    </form>
</div>

<script>
const currentUserId = localStorage.getItem('telegramId') || 'user_' + Date.now();
const userName = localStorage.getItem('userName') || 'Гость';

let selectedFiles = [];

// Загрузка категорий
async function loadCategories() {
    try {
        const res = await fetch('/api/categories');
        const cats = await res.json();
        const select = document.getElementById('category');
        cats.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = `${c.icon} ${c.name}`;
            select.appendChild(opt);
        });
    } catch (e) { console.error(e); }
}

// Обработка выбора фото
document.getElementById('addPhotoBtn').addEventListener('click', () => {
    document.getElementById('images').click();
});

document.getElementById('images').addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    
    // Ограничение до 5 фото
    const remainingSlots = 5 - selectedFiles.length;
    const filesToAdd = files.slice(0, remainingSlots);
    
    filesToAdd.forEach(file => {
        if (file.type.startsWith('image/')) {
            selectedFiles.push(file);
        }
    });
    
    updatePhotoPreview();
});

// Обновление превью
function updatePhotoPreview() {
    const container = document.getElementById('photoPreview');
    const countLabel = document.getElementById('photoCount');
    
    // Очищаем контейнер (кроме кнопки добавления)
    container.innerHTML = '';
    
    // Добавляем превью выбранных фото
    selectedFiles.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const preview = document.createElement('div');
            preview.className = 'photo-preview';
            preview.innerHTML = `
                <img src="${e.target.result}" alt="Фото ${index + 1}">
                <button type="button" class="remove-btn" onclick="removePhoto(${index})">×</button>
            `;
            container.insertBefore(preview, document.getElementById('addPhotoBtn'));
        };
        reader.readAsDataURL(file);
    });
    
    // Кнопка добавления (если меньше 5 фото)
    if (selectedFiles.length < 5) {
        const addBtn = document.createElement('div');
        addBtn.className = 'photo-preview add-photo';
        addBtn.id = 'addPhotoBtn';
        addBtn.innerHTML = '<span>+</span>';
        addBtn.onclick = () => document.getElementById('images').click();
        container.appendChild(addBtn);
    }
    
    countLabel.textContent = `${selectedFiles.length} / 5 фото`;
}

// Удаление фото
function removePhoto(index) {
    selectedFiles.splice(index, 1);
    updatePhotoPreview();
}

// Отправка формы
document.getElementById('createForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Публикация...';

    const formData = new FormData();
    formData.append('telegramId', currentUserId);
    formData.append('username', userName);
    formData.append('firstName', userName);
    formData.append('categoryId', document.getElementById('category').value);
    formData.append('title', document.getElementById('title').value);
    formData.append('price', document.getElementById('price').value);
    formData.append('description', document.getElementById('description').value);
    formData.append('city', document.getElementById('city').value);

    selectedFiles.forEach(file => {
        formData.append('images', file);
    });

    try {
        const res = await fetch('/api/listings', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
            alert('✅ Объявление успешно опубликовано!');
            window.location.href = '/index.html';
        } else {
            alert('❌ Ошибка: ' + (data.error || 'Неизвестная ошибка'));
            btn.disabled = false;
            btn.textContent = 'Опубликовать';
        }
    } catch (e) {
        alert('❌ Ошибка сети');
        btn.disabled = false;
        btn.textContent = 'Опубликовать';
    }
});

loadCategories();
</script>
</body>
</html>
