<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сыктывкар Барахолка</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- ШАПКА -->
        <header class="header">
            <div class="header-top">
                <div class="logo">
                    <span class="logo-icon">🏙️</span>
                    Сыктывкар
                </div>
                <div class="user-info">
                    <span id="user-name">Гость</span>
                </div>
            </div>
            <div class="city-selector">
                📍 Сыктывкар
            </div>
        </header>

        <!-- ПОИСК -->
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="Поиск по объявлениям...">
        </div>

        <!-- КАТЕГОРИИ -->
        <section class="categories-section">
            <h2 class="section-title">Категории</h2>
            <div class="categories-grid" id="categories-grid">
                <!-- Категории загрузятся через JS -->
            </div>
        </section>

        <!-- ЛЕНТА ОБЪЯВЛЕНИЙ -->
        <section class="listings-section">
            <div class="listings-header">
                <h2 class="section-title">Свежие объявления</h2>
            </div>
            <div id="listings-container">
                <!-- Объявления загрузятся через JS -->
            </div>
        </section>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
        <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <div class="nav-icon">🏠</div>
            <div class="nav-label">Главная</div>
        </a>
        <a href="favorites.html" class="nav-item">
            <div class="nav-icon">❤️</div>
            <div class="nav-label">Избранное</div>
        </a>
        <a href="chats.html" class="nav-item">
            <div class="nav-icon" style="position: relative;">
                💬
                <span id="unread-badge" style="display: none; position: absolute; top: -6px; right: -10px; background: #f44336; color: white; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; align-items: center; justify-content: center; padding: 0 4px;">0</span>
            </div>
            <div class="nav-label">Чаты</div>
        </a>
        <a href="create.html" class="nav-item">
            <div class="nav-icon">➕</div>
            <div class="nav-label">Создать</div>
        </a>
        <a href="my-listings.html" class="nav-item">
            <div class="nav-icon">📋</div>
            <div class="nav-label">Мои</div>
        </a>
    </nav>

    <script src="js/app.js"></script>
    <script>
        // Обновляем имя пользователя в шапке
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user && user.first_name) {
                document.getElementById('user-name').textContent = user.first_name;
            }
        });
    </script>
</body>
</html>
