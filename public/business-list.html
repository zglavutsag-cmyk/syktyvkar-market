<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бизнес-витрины Сыктывкара</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- ШАПКА -->
        <header class="header">
            <div class="header-top">
                <a href="index.html" style="text-decoration: none; color: var(--accent-blue); font-size: 16px;">
                    ← Назад
                </a>
                <div class="user-info">
                    <span id="user-name">Гость</span>
                </div>
            </div>
            <h1 style="font-size: 24px; font-weight: 700; margin-top: 12px;">🏢 Бизнес-витрины</h1>
            <p style="color: var(--text-secondary); font-size: 14px; margin-top: 8px;">
                Местные компании и мастера Сыктывкара
            </p>
        </header>

        <!-- КНОПКА СОЗДАТЬ СВОЙ МАГАЗИН -->
        <a href="create-business.html" class="btn btn-primary" style="margin-bottom: 16px; background: linear-gradient(135deg, #ffd700, #ffaa00); color: #000; font-weight: 700;">
             Создать свой магазин
        </a>

        <!-- ФИЛЬТРЫ ПО КАТЕГОРИЯМ -->
        <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px;">
            <button class="filter-btn active" data-category="">Все</button>
            <button class="filter-btn" data-category="Еда и напитки">🍔 Еда</button>
            <button class="filter-btn" data-category="Ремонт и строительство">🔨 Ремонт</button>
            <button class="filter-btn" data-category="Красота и здоровье">💅 Красота</button>
            <button class="filter-btn" data-category="Образование">🎓 Обучение</button>
            <button class="filter-btn" data-category="Автоуслуги">🚗 Авто</button>
            <button class="filter-btn" data-category="Другое">📦 Другое</button>
        </div>

        <!-- СПИСОК БИЗНЕСОВ -->
        <div id="business-list-container">
            <!-- Загрузится через JS -->
        </div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <div class="nav-icon">🏠</div>
            <div class="nav-label">Главная</div>
        </a>
        <a href="free.html" class="nav-item">
            <div class="nav-icon">🎁</div>
            <div class="nav-label">Даром</div>
        </a>
        <a href="business-list.html" class="nav-item active">
            <div class="nav-icon">🏢</div>
            <div class="nav-label">Бизнес</div>
        </a>
        <a href="chats.html" class="nav-item">
            <div class="nav-icon">💬</div>
            <div class="nav-label">Чаты</div>
        </a>
        <a href="my-listings.html" class="nav-item">
            <div class="nav-icon">📋</div>
            <div class="nav-label">Мои</div>
        </a>
    </nav>

    <script src="js/app.js"></script>
    <script>
        // Обновляем имя пользователя
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user && user.first_name) {
                document.getElementById('user-name').textContent = user.first_name;
            }
            
            // Загружаем список бизнесов
            loadBusinessList();
            
            // Обработчики фильтров
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadBusinessList(btn.dataset.category);
                });
            });
        });

        async function loadBusinessList(category = '') {
            const container = document.getElementById('business-list-container');
            container.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-secondary);">Загрузка...</div>';
            
            try {
                const url = category 
                    ? `/api/business/list?category=${encodeURIComponent(category)}`
                    : '/api/business/list';
                
                const response = await fetch(url);
                const businesses = await response.json();
                
                if (businesses.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">🏢</div>
                            <div class="empty-title">Пока нет бизнес-профилей</div>
                            <div class="empty-text">Будьте первым — создайте витрину своего бизнеса!</div>
                            <a href="create-business.html" class="btn btn-primary" style="margin-top: 20px; display: inline-block; width: auto; padding: 12px 24px;">
                                🏪 Создать магазин
                            </a>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = businesses.map(b => {
                    const isPremium = b.is_premium === 1 && new Date(b.premium_until) > new Date();
                    return `
                        <a href="business.html?userId=${b.user_id}" class="business-card-link">
                            <div class="business-card" style="${isPremium ? 'border: 2px solid #ffd700; background: linear-gradient(135deg, #fffdf0, #fff);' : ''}">
                                ${isPremium ? '<div class="premium-badge">⭐ PREMIUM</div>' : ''}
                                <div class="business-card-logo">
                                    ${b.logo_filename 
                                        ? `<img src="/uploads/${b.logo_filename}" alt="Logo">` 
                                        : '🏢'}
                                </div>
                                <div class="business-card-info">
                                    <div class="business-card-name">${b.business_name}</div>
                                    <div class="business-card-category">${b.category || 'Бизнес'}</div>
                                    <div class="business-card-meta">
                                        <span>⭐ ${b.rating || 5}</span>
                                        <span>📦 ${b.active_listings || 0} объявл.</span>
                                    </div>
                                    ${b.description ? `<div class="business-card-desc">${b.description.substring(0, 80)}${b.description.length > 80 ? '...' : ''}</div>` : ''}
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: #f44336;">Ошибка загрузки</div>';
            }
        }
    </script>

    <style>
        .filter-btn {
            padding: 8px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            color: var(--text-primary);
        }
        
        .filter-btn.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }
        
        .filter-btn:active {
            transform: scale(0.95);
        }
        
        .business-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
            margin-bottom: 12px;
        }
        
        .business-card {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: 16px;
            display: flex;
            gap: 16px;
            align-items: center;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
            position: relative;
        }
        
        .business-card:active {
            transform: scale(0.98);
            box-shadow: var(--shadow-md);
        }
        
        .business-card-logo {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid var(--border-color);
        }
        
        .business-card-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .business-card-info {
            flex: 1;
            min-width: 0;
        }
        
        .business-card-name {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-primary);
        }
        
        .business-card-category {
            font-size: 13px;
            color: var(--accent-blue);
            margin-bottom: 6px;
        }
        
        .business-card-meta {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        
        .business-card-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }
    </style>
</body>
</html>
