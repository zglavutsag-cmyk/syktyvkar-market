<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Чаты | Сыктывкар Барахолка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #f5f5f7; color: #1c1c1e; padding-bottom: 70px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; position: sticky; top: 0; z-index: 100; }
        .back-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; text-decoration: none; }
        .header h1 { font-size: 18px; font-weight: 700; }
        .chat-list { padding: 10px; }
        .chat-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; display: flex; align-items: center; gap: 12px; }
        .chat-avatar { width: 50px; height: 50px; border-radius: 50%; background: #667eea; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 20px; flex-shrink: 0; }
        .chat-info { flex: 1; overflow: hidden; }
        .chat-name { font-weight: 600; margin-bottom: 4px; }
        .chat-last-msg { font-size: 14px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        
        .chat-screen { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #f5f5f7; z-index: 200; flex-direction: column; }
        .chat-screen.active { display: flex; }
        .chat-header { background: white; padding: 15px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .messages-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4; }
        .message.mine { background: #667eea; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.theirs { background: white; color: #1c1c1e; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .input-area { background: white; padding: 10px 15px; display: flex; gap: 10px; border-top: 1px solid #eee; }
        .input-area input { flex: 1; padding: 12px; border: 1px solid #e0e0e0; border-radius: 20px; outline: none; font-size: 15px; }
        .input-area button { background: #667eea; color: white; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

<!-- Список чатов -->
<div id="chatListScreen">
    <div class="header">
        <a class="back-btn" href="/index.html">←</a>
        <h1>Мои чаты</h1>
    </div>
    <div class="chat-list" id="chatList">
        <div class="empty-state">Загрузка чатов...</div>
    </div>
</div>

<!-- Экран переписки -->
<div class="chat-screen" id="chatScreen">
    <div class="chat-header">
        <button class="back-btn" style="color: #1c1c1e;" onclick="closeChat()">←</button>
        <div class="chat-avatar" id="companionAvatar" style="width: 40px; height: 40px; font-size: 16px;">?</div>
        <div>
            <div class="chat-name" id="companionName">Имя</div>
            <div style="font-size: 12px; color: #666;" id="listingTitle">Объявление</div>
        </div>
    </div>
    <div class="messages-area" id="messagesArea"></div>
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Сообщение...">
        <button onclick="sendMessage()"></button>
    </div>
</div>

<script>
let currentUserId = localStorage.getItem('telegramId') || 'user_' + Date.now();
let currentChatId = null;

console.log('💬 ID пользователя в чатах:', currentUserId);

// Проверяем, есть ли параметр chat в URL (прямой переход из listing.html)
const urlParams = new URLSearchParams(window.location.search);
const directChatId = urlParams.get('chat');

async function loadChats() {
    const container = document.getElementById('chatList');
    try {
        console.log(' Загрузка чатов для ID:', currentUserId);
        const res = await fetch(`/api/chats?telegramId=${currentUserId}`);
        const chats = await res.json();
        
        console.log(' Получено чатов:', chats.length);
        
        if (chats.length === 0) {
            container.innerHTML = '<div class="empty-state">У вас пока нет чатов.<br>Найдите объявление и нажмите "Написать"</div>';
            return;
        }
        
        container.innerHTML = chats.map(c => `
            <div class="chat-item" onclick="openChat(${c.chat_id}, '${c.companion_name}', '${c.listing_title || ''}')">
                <div class="chat-avatar">${c.companion_name.charAt(0).toUpperCase()}</div>
                <div class="chat-info">
                    <div class="chat-name">${c.companion_name}</div>
                    <div class="chat-last-msg">${c.last_message || 'Начните диалог'}</div>
                </div>
            </div>
        `).join('');
    } catch (e) {
        console.error(' Ошибка загрузки чатов:', e);
        container.innerHTML = '<div class="empty-state">Ошибка загрузки</div>';
    }
}

function openChat(chatId, companionName, listingTitle) {
    currentChatId = chatId;
    document.getElementById('companionName').textContent = companionName;
    document.getElementById('companionAvatar').textContent = companionName.charAt(0).toUpperCase();
    document.getElementById('listingTitle').textContent = listingTitle || 'Чат';
    document.getElementById('chatListScreen').style.display = 'none';
    document.getElementById('chatScreen').classList.add('active');
    loadMessages();
}

function closeChat() {
    currentChatId = null;
    document.getElementById('chatScreen').classList.remove('active');
    document.getElementById('chatListScreen').style.display = 'block';
    loadChats();
}

async function loadMessages() {
    if (!currentChatId) return;
    const area = document.getElementById('messagesArea');
    try {
        const res = await fetch(`/api/chats/${currentChatId}/messages?telegramId=${currentUserId}`);
        const data = await res.json();
        
        area.innerHTML = data.messages.map(m => `
            <div class="message ${m.sender_id === currentUserId ? 'mine' : 'theirs'}">
                ${m.text}
            </div>
        `).join('');
        area.scrollTop = area.scrollHeight;
    } catch (e) { console.error(e); }
}

async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text || !currentChatId) return;
    
    console.log(' Отправка сообщения:', { chatId: currentChatId, userId: currentUserId, text });
    
    try {
        const res = await fetch(`/api/chats/${currentChatId}/messages`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                telegramId: currentUserId,
                text: text 
            })
        });
        
        if (res.ok) {
            input.value = '';
            loadMessages();
        } else {
            alert('Ошибка отправки');
        }
    } catch (e) {
        console.error(e);
        alert('Ошибка сети');
    }
}

document.getElementById('messageInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
});

// Запуск
loadChats();

// Если есть прямой переход к чату
if (directChatId) {
    setTimeout(() => {
        openChat(parseInt(directChatId), 'Собеседник', 'Объявление');
    }, 500);
}

setInterval(() => { if (currentChatId) loadMessages(); }, 5000);
</script>
</body>
</html>
